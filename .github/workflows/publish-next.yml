name: Publish next

# Manual prerelease path: stamps the four packages to `<base>-next.<id>` and publishes them to the
# `next` dist-tag. Nothing here ever moves `latest`; release-please keeps cutting stable versions.
on:
  workflow_dispatch:
    inputs:
      id:
        description: Prerelease id (defaults to the run number)
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-next:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1.
      - run: npm install -g npm@^11.15.0
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: node scripts/version-next.mjs "${{ inputs.id || github.run_number }}"
      - run: pnpm build
      - run: pnpm check:packages
      - run: pnpm smoke:pack
      # Publishes each package's packed tarball to `next` in dependency order. pnpm rewrites
      # `workspace:*` at pack time; npm CLI authenticates with the workflow's OIDC identity
      # (no token) and generates provenance automatically. `latest` is never touched.
      - run: |
          for pkg in types client core tui; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            pnpm --dir "packages/$pkg" pack --pack-destination "$RUNNER_TEMP/packs"
            npm stage publish "$RUNNER_TEMP/packs/reework-$pkg-$version.tgz" --tag next --access public
          done
        env:
          NPM_CONFIG_PROVENANCE: "true"
