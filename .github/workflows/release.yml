name: Release

# release-please keeps a release PR open from Conventional Commits on main (versions + changelogs for the
# four packages). Merging it tags the release; this workflow then builds, verifies and publishes to npm.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No registry-url: it writes an .npmrc with an empty ${NODE_AUTH_TOKEN}
      # placeholder, which masks the OIDC trusted-publishing exchange.
      - run: pnpm install --frozen-lockfile
      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1.
      - run: npm install -g npm@^11.15.0
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm build
      - run: pnpm check:packages
      - run: pnpm smoke:pack
      # Publishes each package's packed tarball in dependency order. pnpm rewrites
      # `workspace:*` at pack time; npm CLI authenticates with the workflow's OIDC identity
      # (no token) and generates provenance automatically. No tag means `latest`.
      - run: |
          for pkg in types client core tui; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            pnpm --dir "packages/$pkg" pack --pack-destination "$RUNNER_TEMP/packs"
            npm publish "$RUNNER_TEMP/packs/reework-$pkg-$version.tgz" --access public
          done
        env:
          NPM_CONFIG_PROVENANCE: "true"
